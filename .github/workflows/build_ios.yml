name: Build Obfuscated iOS and Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build Obfuscated APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evin-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build Obfuscated iOS App
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols
      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r EvinPlayer_iOS.ipa Payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: evin-player-ios-ipa
          path: EvinPlayer_iOS.ipa
